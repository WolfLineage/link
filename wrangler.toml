#:schema node_modules/wrangler/config-schema.json
name = "link"
main = "src/worker.jsx"
compatibility_date = "2024-07-24"
compatibility_flags = ["nodejs_compat"]

# KV is optional. The converter works without it; only short links need KV.
# To enable short links: create a KV namespace in Cloudflare Dashboard, then
# uncomment the block below and paste your own namespace ID.
# kv_namespaces = [
#   { binding = "SUBLINK_KV", id = "YOUR_KV_NAMESPACE_ID" }
# ]

[assets]
directory = "./public"
